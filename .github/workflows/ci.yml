name: DB Quality Gate CI/CD

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  db-quality-gate:
    name: Database Deployment & Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set MSSQL Password Environment
        id: mssql-env
        run: |
          PASS="${{ secrets.MSSQL_SA_PASSWORD }}"
          if [ -z "$PASS" ]; then
            echo "::error::MSSQL_SA_PASSWORD repository secret is required."
            exit 1
          fi
          echo "MSSQL_SA_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Start MSSQL Docker Container
        run: |
          docker run -d --name sqlserver \
            -e "ACCEPT_EULA=Y" \
            -e "MSSQL_SA_PASSWORD=${{ env.MSSQL_SA_PASSWORD }}" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for MSSQL Engine Readiness
        shell: pwsh
        run: |
          $maxAttempts = 35
          $attempt = 0
          $ready = $false
          while (-not $ready -and $attempt -lt $maxAttempts) {
              $attempt++
              Write-Host "Waiting for MSSQL Server engine... (Attempt $attempt/$maxAttempts)"
              Start-Sleep -Seconds 2
              $check = docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $env:MSSQL_SA_PASSWORD -C -Q "SELECT 1;" 2>&1
              if ($LASTEXITCODE -eq 0) {
                  $ready = $true
                  Write-Host "MSSQL Server Engine is READY!" -ForegroundColor Green
              }
          }
          if (-not $ready) {
              throw "MSSQL Server failed to start within time limit."
          }

      - name: Verify Baseline Freeze Manifest Integrity
        shell: pwsh
        run: |
          ./scripts/freeze-manifest.ps1 -Mode Verify

      - name: Deploy Database Schema (deploy_schema.ps1)
        shell: pwsh
        run: |
          ./deploy_schema.ps1 -ContainerName "sqlserver" -Password $env:MSSQL_SA_PASSWORD

      - name: Execute DB Quality Gate (test_summary.ps1)
        id: db-quality
        shell: pwsh
        run: |
          ./test_summary.ps1 -ContainerName "sqlserver" -Password $env:MSSQL_SA_PASSWORD 2>&1 | Tee-Object -FilePath db-quality-summary.log
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: SonarCloud Configuration Preflight
        id: sonar-config
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          missing=()
          [ -n "$SONAR_TOKEN" ] || missing+=("SONAR_TOKEN secret")
          [ -n "$SONAR_ORGANIZATION" ] || missing+=("SONAR_ORGANIZATION variable")
          [ -n "$SONAR_PROJECT_KEY" ] || missing+=("SONAR_PROJECT_KEY variable")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required SonarCloud configuration: ${missing[*]}"
            exit 1
          fi

      - name: SonarCloud Analysis
        if: steps.sonar-config.outcome == 'success'
        uses: SonarSource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Generate CI Job Summary
        if: always()
        shell: pwsh
        run: |
          "### 🛡️ Resumen de Puerta de Calidad (DB Quality Gate)" >> $env:GITHUB_STEP_SUMMARY
          "- **Motor:** SQL Server 2022 (Linux Container)" >> $env:GITHUB_STEP_SUMMARY
          "- **Manifiesto de Congelamiento:** ✅ Verificado contra SHA256" >> $env:GITHUB_STEP_SUMMARY
          "- **Despliegue de Esquema:** ✅ Exitoso (deploy_schema.ps1)" >> $env:GITHUB_STEP_SUMMARY
          $summaryPath = Join-Path $env:GITHUB_WORKSPACE 'db-quality-summary.log'
          if (Test-Path $summaryPath) {
              $summary = Get-Content $summaryPath -Raw
              $expected = [regex]::Match($summary, '(?m)^TOTAL_EXPECTED=(\d+)').Groups[1].Value
              $executed = [regex]::Match($summary, '(?m)^TOTAL_EXECUTED=(\d+)').Groups[1].Value
              $passed = [regex]::Match($summary, '(?m)^PASSED=(\d+)').Groups[1].Value
              $failed = [regex]::Match($summary, '(?m)^FAILED=(\d+)').Groups[1].Value
              $skipped = [regex]::Match($summary, '(?m)^SKIPPED=(\d+)').Groups[1].Value
              "- **Suite de Pruebas T-SQL:** Expected=$expected; Executed=$executed; Passed=$passed; Failed=$failed; Skipped=$skipped" >> $env:GITHUB_STEP_SUMMARY
          } else {
              "- **Suite de Pruebas T-SQL:** NOT_RUN (summary unavailable)" >> $env:GITHUB_STEP_SUMMARY
          }
          "- **Higiene de Secretos:** validated by required secret preflight" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload DB quality summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-quality-summary
          path: db-quality-summary.log
          if-no-files-found: ignore