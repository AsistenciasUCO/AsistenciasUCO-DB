# Configuración de Proyecto SonarCloud para AsistenciasUCO-DB
# sonar.organization and sonar.projectKey are supplied by official CI variables.
# Local analysis must provide them explicitly; no personal organization is a repository source of truth.
sonar.projectName=AsistenciasUCO-DB
sonar.projectVersion=1.0

# Fuentes a analizar
sonar.sources=.
sonar.inclusions=schema/**/*.sql,*.ps1
sonar.exclusions=scratch/**,test/**,docs/**,schema/seed/**
sonar.coverage.exclusions=**/*.sql,*.ps1

# Codificación
sonar.sourceEncoding=UTF-8
